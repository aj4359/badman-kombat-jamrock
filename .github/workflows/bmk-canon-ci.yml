name: BMK Canon CI

on:
  pull_request:
    branches:
      - main
      - feature/bmk-canon-takeover
  push:
    branches:
      - feature/bmk-canon-takeover
      - feature/bmk-gameplay-clip

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint BMK canon + gameplay runtime
        run: npx eslint src/types/bmkCanon.ts src/data/bmkCanon.ts src/data/bmkProductionAssets.ts src/data/bmkProductionBoard.ts src/lib/bmkAudioDirector.ts src/lib/bmkProductionAssetRegistry.ts src/pages/BMKComicZero.tsx src/pages/BMKGameplayConcept.tsx src/pages/BMKGameplayClip.tsx src/components/bmk

      - name: Build application
        run: npm run build
